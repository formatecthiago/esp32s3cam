name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-cam-firmware
          path: |
            .pio/build/freenove_esp32_s3_wroom/bootloader.bin
            .pio/build/freenove_esp32_s3_wroom/partitions.bin
            .pio/build/freenove_esp32_s3_wroom/firmware.bin
